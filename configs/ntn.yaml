# NTN access/channel simulation (Stage 2)
# NB-IoT NTN class over LEO bent-pipe, store-and-forward.
ntn:
  orbit_alt_km: 600
  passes_per_day: 48          # constellation revisit: one pass every 30 min
  pass_duration_s: 900        # 15-min contact window -> 50% duty cycle
  bandwidth_hz: 180000        # one NB-IoT PRB
  rate_bps: 16000             # effective uplink rate (low-kbps NB-IoT NTN class)
  T_RA_s: 2.0                 # random-access + setup time per attempt
  K_rep: 1                    # repetition factor (sensitivity: 1, 2, 4)
  max_attempts: 3             # access attempts before deferring to next pass
  backoff_s: 5.0              # mean backoff between attempts
  rho: 0.5                    # usable beam-airtime fraction, eq (4); = duty cycle
  deadline_success_target: 0.95   # Pr(d <= D) >= 0.95
  # Population sweep (devices per beam); methodological stress range
  pop_grid: [50, 100, 200, 400, 800, 1600, 3200, 6400]
  n_mc_reports: 2000          # Monte-Carlo reports sampled per (M, mode) point
  M_task: 100                 # operating population for Stage-3 task evaluation
