# Environmental-monitoring trace configuration (India-oriented lens)
# 90-day trace, 5-min sensing step, rainfall intensity + river/reservoir level.
trace:
  days: 90
  dt_min: 5
  phases:
    - {name: dry_pre,      start: 0,  end: 20, rain_lambda: 0.15, rain_mean: 2.0,  temp: 36.0}
    - {name: onset,        start: 20, end: 35, rain_lambda: 0.8,  rain_mean: 8.0,  temp: 33.0}
    - {name: monsoon,      start: 35, end: 70, rain_lambda: 2.2,  rain_mean: 18.0, temp: 30.0}
    - {name: withdrawal,   start: 70, end: 80, rain_lambda: 0.6,  rain_mean: 6.0,  temp: 32.0}
    - {name: dry_post,     start: 80, end: 90, rain_lambda: 0.15, rain_mean: 2.0,  temp: 34.0}
  temp_diurnal_amp: 5.0
  temp_noise: 0.8
  rain_noise: 0.6
  # River-level model: level responds to catchment rainfall with lag
  level_base_m: 2.0
  level_gain: 0.02             # m per (mm/h sustained) convolved; calibrated so
                               # monsoon mean rain (~3 mm/h) gives ~4.0 m (below
                               # danger) and cloudbursts push it over 4.5 m
  level_lag_h: 8.0             # catchment response lag
  level_decay_h: 30.0          # recession time constant
  level_noise: 0.05            # observation noise m
  rain_noise_level: 0.1
  danger_level_m: 4.5          # flood threshold (ground truth)
  # Ground-truth flood event: level above danger for >= this long
  event_persist_min: 30.0
  # Flood episode ends when the level recedes below danger - hyst
  # (same latch semantics as the warning device)
  flood_hyst_m: 0.3
  # Correlated burst episodes: storms hitting a device cluster together
  burst:
    n_episodes: 4              # per 90-day trace (monsoon phase)
    cluster_frac: 0.05         # fraction of beam population in the cluster
    episode_spread_min: 10.0   # devices trigger within this window
    extra_rain_mm_h: 40.0      # cloudburst intensity

task:
  name: flood_warning
  deadline_min: 45.0           # warning must arrive within 45 min of onset
  miss_target: 0.01            # P_miss target <= 1%
  fa_target_per_week: 1.0      # false-alarm budget
  persist_confirm: 2           # consecutive over-threshold samples before warning
  hysteresis: 0.3              # reset latch only when level drops thr - hysteresis
  smooth: 6                    # causal moving-average length (samples; 6 x 5 min = 30 min)
  warn_levels: [watch, warning, severe]
